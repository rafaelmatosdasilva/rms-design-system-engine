name: Ask for something
description: A capability, a check, a setting, or a change to how something works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth a look at [ROADMAP.md](https://github.com/rafaelmatosdasilva/rms-design-system-engine/blob/main/ROADMAP.md) first: it may already be on the way, or already decided against.

  - type: dropdown
    id: part
    attributes:
      label: Which part
      description: The part of the [features page](https://github.com/rafaelmatosdasilva/rms-design-system-engine/blob/main/docs/features.md) it belongs to, or Not sure.
      options:
        - Check your Figma library
        - Lint your codebase
        - Compare Figma and code
        - Test accessibility
        - Write component specs
        - Gather usage guidelines
        - Annotate Figma from the code
        - Publish a living style guide
        - Try components in a playground
        - Turn Figma into code
        - Bring code components into Figma
        - Generate components in Figma and code
        - Prototype with your real components
        - Setting up or updating it
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation you are in, not the feature. What goes wrong today, or what you end up doing by hand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you think would fix it
      description: A command, a check, a setting, a different default. A guess is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing options, other tools, a workaround, and why each falls short.
    validations:
      required: false
