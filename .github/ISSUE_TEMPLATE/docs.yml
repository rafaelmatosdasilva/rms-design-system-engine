name: The documentation is wrong
description: A page says something the engine doesn't do, or doesn't say something it does.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        A typo or a broken link belongs here too.

  - type: dropdown
    id: part
    attributes:
      label: Which part
      description: The part of the [features page](https://github.com/rafaelmatosdasilva/rms-design-system-engine/blob/main/docs/features.md) the page is about, or Not sure.
      options:
        - Check your Figma library rules
        - Measure Figma-code parity
        - Test accessibility
        - Lint your codebase rules
        - Write component specs
        - Gather usage guidelines
        - Annotate Figma from the code
        - Publish a living style guide
        - Try components in a playground
        - Design themes over your system
        - Turn Figma into code
        - Turn code into Figma
        - Generate in Figma from a prompt
        - Generate in code from a prompt
        - Prototype with your real components
        - Setting up or updating it
        - Not sure
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: The page, and the heading or line.
      placeholder: docs/audit.md, "Compare Figma and code"
    validations:
      required: true

  - type: textarea
    id: says
    attributes:
      label: What it says
    validations:
      required: true

  - type: textarea
    id: actually
    attributes:
      label: What is actually the case
      description: What you found when you ran it.
    validations:
      required: true

  - type: checkboxes
    id: credit
    attributes:
      label: When it is fixed
      description: Leave it unticked and the release says nothing of you.
      options:
        - label: Thank me in the release notes, by my GitHub handle, in the release that fixes this.
          required: false
