name: The documentation is wrong
description: A page says something the engine doesn't do, or doesn't say something it does.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        A typo or a broken link belongs here too.

  - type: dropdown
    id: part
    attributes:
      label: Which part
      description: The part of the [features page](https://github.com/rafaelmatosdasilva/rms-design-system-engine/blob/main/docs/features.md) the page is about, or Not sure.
      options:
        - Check your Figma library
        - Lint your codebase
        - Compare Figma and code
        - Test accessibility
        - Write component specs
        - Gather usage guidelines
        - Annotate Figma from the code
        - Publish a living style guide
        - Try components in a playground
        - Turn Figma into code
        - Bring code components into Figma
        - Generate components in Figma and code
        - Prototype with your real components
        - Setting up or updating it
        - Not sure
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: The page, and the heading or line.
      placeholder: docs/audit.md, "Compare Figma and code"
    validations:
      required: true

  - type: textarea
    id: says
    attributes:
      label: What it says
    validations:
      required: true

  - type: textarea
    id: actually
    attributes:
      label: What is actually the case
      description: What you found when you ran it.
    validations:
      required: true
