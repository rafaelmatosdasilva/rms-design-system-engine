name: Dependabot auto-merge

# Every pull request this repository opens merges itself once its checks are green (CLAUDE.md), and Dependabot's are no
# exception: a security fix for a test tool used to wait until somebody noticed it, while the OpenSSF Scorecard counted
# the advisory against the repository. This turns auto-merge on for Dependabot's pull requests only. It never merges
# anything itself: GitHub merges when the required checks (the full suite among them) pass, and a red one holds it.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: read-all

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot quotes each package's release notes and commits, which name people, and a squash merge writes the
      # description into the commit message, so the privacy check refused the bump (lib/dependabot-body.mjs says why).
      # Its own lines, what it bumps and to which version, are kept; editing the description re-runs that check.
      - name: Keep Dependabot's own words in the description
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/body.md"
          node lib/dependabot-body.mjs "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/own.md"
          if ! cmp -s <(sed -e '$a\' "$RUNNER_TEMP/body.md") "$RUNNER_TEMP/own.md"; then gh pr edit "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/own.md"; fi
      - run: gh pr merge "$PR" --auto --squash --repo "$REPO"
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
