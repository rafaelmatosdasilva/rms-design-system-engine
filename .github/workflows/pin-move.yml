# The pins the npm registry can be asked about (axe-core, IBM's checker, web-features, Playwright) found behind, tried,
# and proposed one pull request a pin, as DSDS's are (dsds-release.yml). lib/pin-move.mjs says why and how: each pin is
# a version and the hash of the file the engine fetches for it, and the two always move together.
#
# Two jobs, so the new version's code never runs where anything can be written. "try" has a read-only token: it moves
# the pin in its own copy and runs the tests that use that tool. "propose" runs none of the tool's code: it moves the
# pin with the hash try worked out, commits, opens the pull request with try's report, and starts the test suite on
# its branch (a pull request a workflow opens starts no pull_request workflow). A person merges it.
name: Pin move

on:
  schedule:
    # Monday, after the pinned standards' own ask (pinned-standards.yml, 07:41), off the hour.
    - cron: '53 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-move

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      behind: ${{ steps.behind.outputs.behind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Which pins are behind
        id: behind
        run: |
          b=$(node lib/pin-move.mjs behind)
          echo "$b"
          echo "behind=$b" >> "$GITHUB_OUTPUT"

  try:
    needs: find
    if: needs.find.outputs.behind != '[]' && needs.find.outputs.behind != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        pin: ${{ fromJSON(needs.find.outputs.behind) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Is it already proposed
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: pin/${{ matrix.pin.id }}-${{ matrix.pin.latest }}
        run: echo "open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length > 0')" >> "$GITHUB_OUTPUT"
      - name: Its hash, and the pin moved in this copy only
        id: hash
        if: steps.open.outputs.open != 'true'
        env:
          ID: ${{ matrix.pin.id }}
          LATEST: ${{ matrix.pin.latest }}
        run: |
          h=$(node lib/pin-move.mjs hash "$ID" "$LATEST")
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          node lib/pin-move.mjs move "$ID" "$LATEST" "$h"
      - name: The tests that use it, against the new version
        id: tests
        if: steps.open.outputs.open != 'true'
        continue-on-error: true
        env:
          ID: ${{ matrix.pin.id }}
        run: |
          set -o pipefail
          before=$(node lib/pin-move.mjs before "$ID")
          [ -n "$before" ] && eval "$before"
          node --test $(node lib/pin-move.mjs tries "$ID") 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: The report
        if: steps.open.outputs.open != 'true'
        env:
          ID: ${{ matrix.pin.id }}
          PINNED: ${{ matrix.pin.pinned }}
          LATEST: ${{ matrix.pin.latest }}
          HASH: ${{ steps.hash.outputs.hash }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "$ID $LATEST is out. This moves the engine's pin from \`$PINNED\` to \`$LATEST\`, with the hash of the file the engine fetches for it, worked out from the registry's own package: \`$HASH\`."
            echo
            echo "- The tests that use it ($(node lib/pin-move.mjs tries "$ID")), against the new version: **$TESTS**"
            if [ "$TESTS" != success ]; then echo; echo '<details><summary>What failed</summary>'; echo; echo '```'; grep -E '^not ok|^# (pass|fail)|Error|expected|actual' "$RUNNER_TEMP/tests.log" | head -60; echo '```'; echo '</details>'; fi
            echo
            echo "The whole suite runs on this branch too. Nothing in the engine changes until a person merges this; when something failed, what reads the tool's answers changes first, on this branch."
          } > "$RUNNER_TEMP/out/report.md"
          printf '%s' "$HASH" > "$RUNNER_TEMP/out/hash"
          printf '%s' "$TESTS" > "$RUNNER_TEMP/out/tests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.open.outputs.open != 'true'
        with:
          name: pin-${{ matrix.pin.id }}
          path: ${{ runner.temp }}/out
          retention-days: 1

  propose:
    needs: [find, try]
    if: always() && needs.find.outputs.behind != '[]' && needs.find.outputs.behind != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        pin: ${{ fromJSON(needs.find.outputs.behind) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # None for a pin already proposed: the step below sees no hash and leaves it.
        continue-on-error: true
        with:
          name: pin-${{ matrix.pin.id }}
          path: ${{ runner.temp }}/out
      - name: The pin moved, on a branch of its own, and the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.pin.id }}
          LATEST: ${{ matrix.pin.latest }}
        run: |
          [ -s "$RUNNER_TEMP/out/hash" ] || { echo "already proposed, or not tried: nothing to do"; exit 0; }
          branch="pin/$ID-$LATEST"
          node lib/pin-move.mjs move "$ID" "$LATEST" "$(cat "$RUNNER_TEMP/out/hash")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "$ID $LATEST: the pin and its hash moved"
          git push origin "$branch"
          draft=''
          [ "$(cat "$RUNNER_TEMP/out/tests")" = success ] || draft='--draft'
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main $draft \
            --title "$ID $LATEST" --body-file "$RUNNER_TEMP/out/report.md" --label 'release: patch' --label 'after: nothing'
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
