# Every pull request here merges itself: opened, labelled, auto-merge on, and GitHub merges it the moment its checks
# are green. Nobody watches one afterwards, which is right until it cannot merge - then it sits with a green tick and
# auto-merge on, looking exactly like one about to land. Two have sat for days that way, and what found them both was
# somebody wondering why a branch never landed.
#
# This asks daily, and keeps one issue current while any is stuck (lib/merge-stalled.mjs). Daily rather than weekly:
# a pull request that cannot merge should be found the same day, since the fix is one push.
name: Merge stalled

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-stalled

jobs:
  ask:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Can every open pull request still merge
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Exit 1 says one is stuck, which the issue already carries: the run itself is not a failure.
        run: node lib/merge-stalled.mjs check || true
