name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The browser tests use the runner's Chrome (found on PATH); without it they skip.
      # Each failing test is also written as an annotation, so its name and first error lines show on the check.
      - name: Run the test suite
        shell: bash
        run: |
          set -o pipefail
          node --test test/*.test.mjs 2>&1 | tee test.log
          code=$?
          if [ "$code" != 0 ]; then
            grep -n '^not ok' test.log | while IFS= read -r line; do
              n=${line%%:*}
              echo "::error title=${line#*:}::$(sed -n "$((n+1)),$((n+40))p" test.log | grep -E "error|expected|actual|Error|message" | head -6 | tr '\n' ' ' | cut -c1-900)"
            done
          fi
          exit $code
