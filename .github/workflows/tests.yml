name: Tests

# Once for a change, not twice. `push:` on every branch and `pull_request:` together ran the whole suite twice for the
# same commit - two runs of about fifteen minutes, and a merge waited for both. main keeps its own run, which is what
# writes the badge below; every other workflow here already limits its push the same way.
on:
  push:
    branches: [main]
  pull_request:
  # A pull request a workflow opens (dsds-release.yml) starts no pull_request run, so that workflow starts this one on
  # its branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The suite is split by file across four machines that run at once: one machine took about sixteen minutes, most of it
  # waiting on browsers, and a shared runner has only four cores. test/shard.mjs gives each machine an equal share of the
  # time each file last took. Each quarter is a whole run of its own, with every tool installed, so a file never
  # depends on which quarter it lands in.
  suite:
    name: suite ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # A failing quarter does not stop the others: the run then names every failing test, not just the first ones.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Every tool below comes from its folder's committed lockfile (npm ci), so each run installs exactly the versions
      # last tested, with the runner's own npm (a lockfile needs no peer resolution, so npm 10 is enough for Nuxt). The
      # build scorer and the component harness read JSX with TypeScript, found as a machine-wide one is (NODE_PATH, tsc
      # on the PATH).
      - name: Install TypeScript
        run: |
          npm ci --prefix test/.ci-tools --no-audit --no-fund
          echo "$PWD/test/.ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$PWD/test/.ci-tools/node_modules" >> "$GITHUB_ENV"
      # The Vue harness renders a Vue project's components with that project's own build (Vite, Vue CLI and webpack,
      # Nuxt): its tests lay the build tools such a project has in folders of their own (test/vue-harness.test.mjs,
      # test/vue-builds.test.mjs).
      # ESLint, which test/lint.test.mjs runs over the engine's own code (docs/development.md#coding-standards).
      - name: Install ESLint
        run: npm ci --prefix test/.lint-tools --no-audit --no-fund
      - name: Install the Vue build tools the Vue tests use
        run: |
          npm ci --prefix test/.vue-tools --no-audit --no-fund
          npm ci --prefix test/.vue-cli-tools --no-audit --no-fund
          npm ci --prefix test/.nuxt-tools --no-audit --no-fund
      # The React harness draws a React project's components with that project's own React and Vite
      # (test/react-harness.test.mjs). Without these its browser tests skip, and a skipped browser test checked
      # nothing - which is what the skip count below refuses to let pass quietly.
      - name: Install the React build tools the React tests use
        run: npm ci --prefix test/.react-tools --no-audit --no-fund
      # Lit and the Vite a Lit project builds with (test/lit-harness.test.mjs): without them its browser tests skip.
      - name: Install the Lit build tools the Lit tests use
        run: npm ci --prefix test/.lit-tools --no-audit --no-fund
      # Angular's compiler, its builder (which brings Vite) and Angular itself, as an Angular project installs them
      # (test/angular-harness.test.mjs): without them its browser tests skip.
      - name: Install the Angular build tools the Angular tests use
        run: npm ci --prefix test/.angular-tools --no-audit --no-fund
      # Storybook, which builds a team's stories into the pages the browser checks run on (test/storybook-real.test.mjs):
      # real Storybook, never a stand-in, so a story is read as Storybook itself draws it.
      - name: Install the Storybook a team builds its stories with
        run: npm ci --prefix test/.storybook-tools --no-audit --no-fund
      # DSDS's published schema, suite and examples for the pinned version, which the DSDS tests check against. Fetched,
      # never committed (lib/dsds-release.mjs says why); the runner's Ruby turns DSDS's YAML examples into JSON.
      - name: Fetch the pinned DSDS release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node lib/dsds-release.mjs fetch
      # The browser tests use the runner's Chrome (found on PATH); one that skips without it fails the run.
      # Each failing test is also written as an annotation, so its name and first error lines show on the check.
      - name: Run the test suite
        id: suite
        shell: bash
        # A shared runner has few cores and is often busy: the browser tests' time limits get the time it takes (a limit
        # made longer only delays a real hang, it never lets a failing test pass).
        env:
          RMS_TEST_TIME_SCALE: '3'
        run: |
          set -o pipefail
          code=0
          node --test $(node test/shard.mjs ${{ matrix.shard }} 4) 2>&1 | tee test.log || code=$?
          if [ "$code" != 0 ]; then
            grep -n '^not ok' test.log | while IFS= read -r line; do
              n=${line%%:*}
              echo "::error title=${line#*:}::$(sed -n "$((n+1)),$((n+40))p" test.log | grep -E "error|expected|actual|Error|message" | head -6 | tr '\n' ' ' | cut -c1-900)"
            done
          fi
          # A browser test that skipped for want of Chrome checked nothing: the run fails, so a missing Chrome can never pass quietly.
          skipped=$(grep -ciE '# SKIP .*chrome' test.log || true)
          if [ "$skipped" != 0 ]; then
            echo "::error title=Browser tests skipped::$skipped browser test(s) skipped because Chrome was not found; they must run."
            code=1
          fi
          # The number the badge shows, taken from the run's own summary rather than counted by hand: the README said
          # "2,000+" for as long as somebody remembered to change it. Read before the exit, so a failed run still
          # reports what it managed to count.
          count=$(grep -m1 '^# tests ' test.log | awk '{print $3}')
          echo "${count:-0}" > count-${{ matrix.shard }}.txt
          exit $code
      # What this quarter counted, for the test job below to add up. Kept even when the quarter failed.
      - name: Keep the count
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: count-${{ matrix.shard }}
          path: count-${{ matrix.shard }}.txt
          retention-days: 1

  # The other path: Playwright drives the browsers (lib/playwright.mjs), the engine's pinned copy with its own Firefox
  # and WebKit, on each system. The suite above runs without it, so every browser check runs both ways, and the tests
  # that hold the two drivers to one answer (test/playwright.test.mjs) must all run here: one skipped fails the job.
  playwright:
    name: playwright ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Linux needs the system libraries WebKit draws with; Playwright's own command installs them.
      - name: Fetch the pinned Playwright and its browsers
        shell: bash
        run: node lib/playwright.mjs --fetch --browsers $([ "$RUNNER_OS" = Linux ] && echo --with-deps)
      - name: Run the browser checks through Playwright
        shell: bash
        env:
          RMS_TEST_TIME_SCALE: '3'
        run: |
          set -o pipefail
          git config --global core.autocrlf false
          node lib/playwright.mjs
          node --test --test-reporter=tap --test-timeout=900000 test/playwright.test.mjs test/cross-browser.test.mjs test/a11y-browsers.test.mjs test/browsers.test.mjs 2>&1 | tee test.log
          skipped=$(grep -cE '^\s*ok .* # SKIP' test.log || true)
          if [ "$skipped" != 0 ]; then
            grep -E '^\s*ok .* # SKIP' test.log
            echo "::error title=Browser tests skipped::$skipped browser test(s) skipped; with Playwright here every one must run."
            exit 1
          fi

  # The check a pull request waits for (main's ruleset requires `test`): it passes only when all four quarters and every Playwright run passed,
  # and it adds up what they counted, for the badge job below. A quarter that never reported counts nothing.
  test:
    needs: [suite, playwright]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.total.outputs.count }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # None to fetch (every quarter cancelled) is not this step's failure: the result below decides.
        continue-on-error: true
        with:
          pattern: count-*
          merge-multiple: true
      - name: Add up the quarters
        id: total
        shell: bash
        env:
          RESULT: ${{ needs.suite.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
        run: |
          count=$(cat count-*.txt 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "The four quarters ran $count tests: $RESULT."
          echo "Through Playwright: $PLAYWRIGHT."
          [ "$RESULT" = success ] && [ "$PLAYWRIGHT" = success ]

  # The README's tests badge reads one file on the `badges` branch (an orphan branch holding nothing else). Only main
  # writes it, and only when the number or the outcome actually changed, so the branch does not take a commit per push.
  badge:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Say what the suite counted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COUNT: ${{ needs.test.outputs.count }}
          RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          # Thousands separators without depending on the runner's locale.
          pretty=$(echo "${COUNT:-0}" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')
          # Read as one phrase, "Tests passed 2,807": the count is of tests that passed. A red run says only that it
          # failed, never a count that reads as that many failures.
          # The value's colour is the result: a lighter green beside the README's dark green label (4.5:1 with white
          # text), red when the suite fails.
          if [ "$RESULT" = success ]; then
            label="Tests passed"; message="$pretty"; color=3D841D
          else
            label="Tests"; message="failing"; color=red
          fi
          json=$(printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}' "$label" "$message" "$color")
          sha=$(gh api "repos/$REPO/contents/tests.json?ref=badges" --jq .sha 2>/dev/null || true)
          now=$(gh api "repos/$REPO/contents/tests.json?ref=badges" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ "$(echo "$now" | tr -d '[:space:]')" = "$(echo "$json" | tr -d '[:space:]')" ]; then
            echo "Badge already says: $message"
            exit 0
          fi
          gh api -X PUT "repos/$REPO/contents/tests.json" \
            -f message="tests: $message" \
            -f branch=badges \
            -f content="$(printf '%s\n' "$json" | base64 -w0)" \
            ${sha:+-f sha="$sha"} > /dev/null
          echo "Badge now says: $message"
