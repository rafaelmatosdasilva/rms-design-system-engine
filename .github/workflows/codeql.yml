name: CodeQL

# GitHub's code scanning on every change and every week: the engine's JavaScript read for injection, unsafe paths
# and the other mistakes CodeQL knows. Findings show under Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
