# A run of the suite that failed only because GitHub never gave one of its jobs a machine is run again, once
# (lib/unstarted.mjs says why: on 24 November 2026 the macOS Playwright job waited 25 minutes, was cancelled with no
# step run, and main went red with every test passing). A job that ran and failed is a result and is never run again.
name: rerun unstarted

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run again the jobs that never started
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node lib/unstarted.mjs "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.run_attempt }}"
