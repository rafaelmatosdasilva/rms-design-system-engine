# Publishes a version once 50 commits on main are in no release yet (CLAUDE.md, Releases; lib/release-due.mjs holds
# the number), and at once for a security fix or a fix for a problem that stops people, started by Claude. It tags the
# next version and creates a GitHub Release whose notes list the pull requests merged since the previous one.
# How big the step is (patch, minor or major) comes from the release labels on those pull requests
# (release-version.mjs). A version covers a set amount of work, never a date: it is asked once a day, so two versions
# never land the same day and none covers a handful of commits. People's installs follow main every day
# (self-update.mjs): a release is the record of what went in, never what brings them a change. Nobody runs this by
# hand. Only tags, releases and the package are written: main itself is never pushed to.
name: release

on:
  schedule:
    # 07:23, not 07:00. A schedule is best-effort and the top of the hour is when the queue is deepest: of the
    # scheduled runs this repository has had, each came 7 to 10 hours after its minute, and more than one never ran
    # at all. CodeQL and Scorecard carry odd minutes for this reason and are the ones whose schedules fire.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only this job writes, and only tags, the release, its signed provenance and the package.
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag and publish the next version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The highest version released so far, not the nearest tag by ancestry: `git describe` answers "which tag
          # is closest walking back from HEAD", which is a lower version whenever tags do not land in version order.
          # On 5 November that returned v2.0.0 while v3.4.0 was already published, so the run computed v2.0.1 and npm
          # refused to publish a version below the one it had. Sorted by version, and only tags HEAD can reach, so a
          # tag on a branch of its own never raises the next version.
          last=$(git tag --list 'v[0-9]*' --merged HEAD --sort=-v:refname | head -1)
          range=${last:+$last..}HEAD
          if [ -n "$last" ] && [ "$(git rev-list --count "$range")" = 0 ]; then
            echo "No commits since $last: nothing to release."
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Is a version due: the one question release-due.mjs answers for the issue it raises, asked here so the
          # number lives in one place. A run started by hand is a security fix or a fix for a problem that stops
          # people, which is exactly the release that must not wait for the group to fill.
          verdict=$(node lib/release-due.mjs due)
          echo "$verdict"
          if [ "${GITHUB_EVENT_NAME:-schedule}" != workflow_dispatch ] && [ "${verdict%% *}" != yes ]; then
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Each pull request merged in the range, with its labels, read once: the release labels set how big the
          # step is (release-version.mjs) and the "after:" labels say what a person does to see it
          # (release-after.mjs).
          labels='[' ; prs='['
          for n in $(git log "$range" --format=%s | sed -nE 's/.*\(#([0-9]+)\)$/\1/p'); do
            l=$(gh pr view "$n" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')
            labels="$labels$l,"
            prs="$prs{\"number\":$n,\"labels\":$l},"
          done
          labels="${labels%,}]" ; prs="${prs%,}]"
          next=$(node lib/release-version.mjs "$last" "$(node -p "require('./package.json').version")" "$labels")
          echo "Releasing $next (previous: ${last:-none})"
          git tag "$next"
          git push origin "$next"
          # What to do, above the notes GitHub generates: a release that asks nothing says so in one line, because
          # silence reads as nobody having written it down.
          node lib/release-after.mjs "$prs" > "$RUNNER_TEMP/notes.md"
          printf '\n' >> "$RUNNER_TEMP/notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$next" \
            ${last:+-f previous_tag_name="$last"} --jq .body >> "$RUNNER_TEMP/notes.md"
          gh release create "$next" --title "$next" --notes-file "$RUNNER_TEMP/notes.md"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      # The release's code as one archive, with signed provenance: a Sigstore attestation that this workflow built it
      # from that tag, which anyone can check with `gh attestation verify <archive> --repo <this repository>`.
      - name: Archive the release
        if: steps.tag.outputs.next != ''
        run: |
          name="rms-design-system-engine-${{ steps.tag.outputs.next }}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "${{ steps.tag.outputs.next }}"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - id: attest
        if: steps.tag.outputs.next != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Attach the archive and its provenance
        if: steps.tag.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$ARCHIVE.intoto.jsonl"
          gh release upload "${{ steps.tag.outputs.next }}" "$ARCHIVE" "$ARCHIVE.intoto.jsonl"
      # The same version as an npm package, on npmjs.org (rms-design-system-engine) and on GitHub Packages
      # (@rafaelmatosdasilva/rms-design-system-engine), for teams that install from a registry. Its name, version and
      # registry are set here only: the committed package.json stays the private one the repository runs from.
      # npmjs.org takes it through trusted publishing (OIDC, no stored token) with signed provenance. NPM_TOKEN, when
      # the repository has it, serves only the very first publish, before npm lets a trusted publisher be attached.
      - name: Publish the package to GitHub Packages
        if: steps.tag.outputs.next != ''
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          next="${{ steps.tag.outputs.next }}"
          npm pkg delete private
          npm pkg set name=@rafaelmatosdasilva/rms-design-system-engine version="${next#v}" \
            repository.type=git repository.url=git+https://github.com/rafaelmatosdasilva/rms-design-system-engine.git
          echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" > "$RUNNER_TEMP/gh-packages.npmrc"
          npm publish --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/gh-packages.npmrc"
      - name: Publish the package to npmjs.org
        if: steps.tag.outputs.next != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg set name=rms-design-system-engine
          npm publish --provenance --access public
