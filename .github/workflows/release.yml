# Publishes a release automatically: every Monday, when main has commits since the last version tag, it tags the
# next version and creates a GitHub Release whose notes list the pull requests merged since the previous one.
# How big the step is (patch, minor or major) comes from the release labels on those pull requests
# (release-version.mjs). Nobody runs this by hand. Only tags, releases and the package are written: main itself is never
# pushed to.
name: release

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only this job writes, and only tags, the release, its signed provenance and the package.
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag and publish the next version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          if [ -n "$last" ] && [ "$(git rev-list --count "$range")" = 0 ]; then
            echo "No commits since $last: nothing to release."
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The labels of each pull request merged in the range, as [[...], [...]].
          labels='['
          for n in $(git log "$range" --format=%s | sed -nE 's/.*\(#([0-9]+)\)$/\1/p'); do
            l=$(gh pr view "$n" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')
            labels="$labels$l,"
          done
          labels="${labels%,}]"
          next=$(node release-version.mjs "$last" "$(node -p "require('./package.json').version")" "$labels")
          echo "Releasing $next (previous: ${last:-none})"
          git tag "$next"
          git push origin "$next"
          if [ -n "$last" ]; then
            gh release create "$next" --title "$next" --generate-notes --notes-start-tag "$last"
          else
            gh release create "$next" --title "$next" --generate-notes
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      # The release's code as one archive, with signed provenance: a Sigstore attestation that this workflow built it
      # from that tag, which anyone can check with `gh attestation verify <archive> --repo <this repository>`.
      - name: Archive the release
        if: steps.tag.outputs.next != ''
        run: |
          name="rms-design-system-engine-${{ steps.tag.outputs.next }}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "${{ steps.tag.outputs.next }}"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - id: attest
        if: steps.tag.outputs.next != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Attach the archive and its provenance
        if: steps.tag.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$ARCHIVE.intoto.jsonl"
          gh release upload "${{ steps.tag.outputs.next }}" "$ARCHIVE" "$ARCHIVE.intoto.jsonl"
      # The same version as an npm package, on npmjs.org (rms-design-system-engine) and on GitHub Packages
      # (@rafaelmatosdasilva/rms-design-system-engine), for teams that install from a registry. Its name, version and
      # registry are set here only: the committed package.json stays the private one the repository runs from.
      # npmjs.org takes it through trusted publishing (OIDC, no stored token) with signed provenance. NPM_TOKEN, when
      # the repository has it, serves only the very first publish, before npm lets a trusted publisher be attached.
      - name: Publish the package to GitHub Packages
        if: steps.tag.outputs.next != ''
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          next="${{ steps.tag.outputs.next }}"
          npm pkg delete private
          npm pkg set name=@rafaelmatosdasilva/rms-design-system-engine version="${next#v}" \
            repository.type=git repository.url=git+https://github.com/rafaelmatosdasilva/rms-design-system-engine.git
          echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" > "$RUNNER_TEMP/gh-packages.npmrc"
          npm publish --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/gh-packages.npmrc"
      - name: Publish the package to npmjs.org
        if: steps.tag.outputs.next != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg set name=rms-design-system-engine
          npm publish --provenance --access public
