version: 2

# A pinned action never moves on its own. Pinning by commit is what makes a workflow reproducible and what keeps a
# retagged release from running here, but it also holds the workflow on the version it was pinned to - a security
# fix upstream included. Dependabot is the other half of that trade: it watches the actions these workflows pin and
# opens one pull request when any of them has moved, carrying the new commit and its version comment.
#
# The engine has no runtime dependencies and `package.json` declares none. The test tools install from their own
# committed lockfiles under `test/`, and those are watched too: a security advisory against one of them counts against
# the repository's OpenSSF Scorecard (Vulnerabilities) as much as one in the engine would. Each folder gets at most one grouped
# pull request a day; a security fix is opened at once, whatever the schedule. Every Dependabot pull request turns on auto-merge (dependabot-auto-merge.yml), so it merges
# itself once the full suite is green, as any other pull request here does.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    # One pull request a week for every action that moved, rather than one per action.
    groups:
      actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    # Every pull request here carries exactly one release label; an action bump is internal work.
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: actions
  - package-ecosystem: npm
    directory: /test/.ci-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      ci-tools:
        patterns:
          - '*'
    # TypeScript 7 is a rewrite that exposes no JS API (no transpileModule, no createSourceFile), and the engine reads
    # JSX and Props through it, so a new TypeScript major waits for a person to check it rather than arriving here.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
  - package-ecosystem: npm
    directory: /test/.eval-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      eval-tools:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
  - package-ecosystem: npm
    directory: /test/.lint-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      lint-tools:
        patterns:
          - '*'
    # A major version of ESLint changes which rules are recommended, and the engine's code is held to them: it is the
    # owner's call, made in a pull request of its own with the fixes it asks for (ESLint 10 was).
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
  - package-ecosystem: npm
    directory: /test/.nuxt-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      nuxt-tools:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
  - package-ecosystem: npm
    directory: /test/.vue-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      vue-tools:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
  - package-ecosystem: npm
    directory: /test/.vue-cli-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      vue-cli-tools:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
  - package-ecosystem: npm
    directory: /test/.react-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      react-tools:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
  - package-ecosystem: npm
    directory: /test/.storybook-tools
    schedule:
      interval: daily
      time: '07:00'
      timezone: Etc/UTC
    groups:
      storybook-tools:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'release: patch'
      - 'after: nothing'
    commit-message:
      prefix: test-tools
