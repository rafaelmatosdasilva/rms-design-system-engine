# Read by OSV-Scanner, and by the OpenSSF Scorecard's Vulnerabilities check, for the lockfile beside it.
#
# Each advisory below has two ranges for nuxt: one that the fix closes ("introduced 4.0.0, fixed 4.6.x") and one for
# the 3.x line, written as "introduced 3.0.0" with no end. With no end that second range covers every version after it,
# 4.6.4 included, so a lockfile already on the fixed version is still reported. This folder is on nuxt 4.6.4 (and its
# @nuxt/nitro-server and @nuxt/vite-server 4.6.4), past every fix, and its tools only build test projects in the
# test suite: nothing here ships with the engine, which has no dependencies.
#
# Each entry expires, so it is read again rather than kept by habit: when it does, check whether the advisory's range
# was corrected (then delete the entry) or a new fix is needed.

[[IgnoredVulns]]
id = "GHSA-f3x9-2chm-73c8"
ignoreUntil = 2027-02-16
reason = "Fixed in nuxt, @nuxt/nitro-server and @nuxt/vite-server 4.6.4, which this lockfile has. The advisory's 3.x range has no end, so it also names 4.6.4. Test tools only."

