<!doctype html>
<!-- The engine's style guide template: ONE template for every design system that uses the engine. Edit it here and
     every project gets the change on its next run. styleguide-gen.mjs fills the markers with each project's own data
     (its tokens, components, icons, docs and apps); nothing project-specific is written in this file. The page shows
     only what Figma and the code agree on: tokens the token check found equal, components drawn with the project's own
     CSS and markup, controls for the props both sides have, labelled with Figma's names. A project can still point
     ds-config.json → styleguide.template at a template of its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living style guide</title>
<style data-system>
/*{{THEME_CSS}}*/
/*{{COMPONENT_CSS}}*/
</style>
<style>
/* ── Style guide chrome: the template is the layout only. Every colour, font, text size, radius, space and shadow
   is a role variable the engine fills with the design system's own tokens (CHROME below); what the system has no
   token for falls back to the browser's own (Canvas, CanvasText, its default font and sizes), never a value of the
   template's, and the style guide check lists it. ─────────────────────────────────────────────────────────────── */
:root {
  color-scheme: light dark;
  --sg-bg: Canvas; --sg-bg-2: Canvas; --sg-surface: Canvas; --sg-stage: var(--sg-bg);
  --sg-text: CanvasText; --sg-text-2: CanvasText; --sg-muted: GrayText; --sg-border: GrayText; --sg-accent: AccentColor;
  --sg-warning: var(--sg-accent); --sg-line: var(--sg-line-width, 1px) solid var(--sg-border);
  --sg-xs: smaller; --sg-s: small; --sg-s-weight: normal; --sg-m: medium; --sg-m-weight: normal; --sg-l: large; --sg-l-weight: bold;
  --sg-h1: var(--sg-l); --sg-h2: var(--sg-l); --sg-heading-weight: bold; --sg-lh: normal;
  --sg-space-xxs: 0.125rem; --sg-space-xs: 0.25rem; --sg-space-s: 0.5rem; --sg-space-m: 0.75rem; --sg-space-l: 1rem; --sg-space-xl: 1.5rem; --sg-space-xxl: 2rem;
  --sg-radius-s: 0; --sg-radius: 0; --sg-radius-l: 0; --sg-radius-pill: 0;
  --sg-shadow: none; --sg-shadow-lift: none; --sg-icon: 1em;
  --sg-ease: 0s;
}
/*{{CHROME}}*/

/* ── Reset ───────────────────────────────────────────────────────────────── */
.sg-page, .sg-page *, .sg-page *::before, .sg-page *::after { box-sizing: border-box; }
.sg-page { margin: 0; }
/* Only the page's own headings and paragraphs: a rule that reached into a preview would restyle the component. */
:where(.sg-sidebar-header, .sg-hero, .sg-section, .sg-subsection, .sg-card, .pg-header, .pg-head, .sg-screens) > :where(h1, h2, h3, p, figure) { margin: 0; }
/* The page's text (font, size, weight, line height, colour) is the system's own: its body rule, which the components
   inherit in the product too. The template sets only the background. */
html, body.sg-page { background: var(--sg-bg); }
/* A scrolling document, not an app window: undo a theme's full-height body so the page scrolls. */
html { overflow: visible; height: auto; }
body.sg-page { height: auto; min-height: 100vh; overflow: visible; display: block; padding: 0; }

/* ── Page layout ─────────────────────────────────────────────────────────── */
.sg-layout { display: flex; min-height: 100vh; }
.sg-sidebar { width: 200px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: var(--sg-line); background: var(--sg-bg-2); display: flex; flex-direction: column; scrollbar-gutter: stable; }
.sg-sidebar-header { padding: var(--sg-space-l) var(--sg-space-l) var(--sg-space-m); border-bottom: var(--sg-line); }
.sg-sidebar-header .sg-title { font-size: var(--sg-s); font-weight: var(--sg-heading-weight); color: var(--sg-text); line-height: var(--sg-lh); }
.sg-sidebar-header > p { font-size: var(--sg-s); font-weight: var(--sg-m-weight); color: var(--sg-muted); margin-top: var(--sg-space-xxs); }
.sg-nav { padding: var(--sg-space-s) 0; flex: 1; }
.sg-nav a { display: flex; align-items: center; gap: var(--sg-space-xs); padding: var(--sg-space-xs) var(--sg-space-l); font-size: var(--sg-s); font-weight: var(--sg-s-weight); color: var(--sg-text-2); text-decoration: none; transition: background 0.1s, color 0.1s; line-height: var(--sg-lh); }
.sg-nav a:hover { color: var(--sg-text); }
.sg-nav a.active { color: var(--sg-text); box-shadow: inset 2px 0 0 var(--sg-text); }
.sg-nav a span.dot { width: 4px; height: 4px; border-radius: 50%; background: var(--sg-muted); flex-shrink: 0; }
.sg-nav-label { font-size: var(--sg-xs); color: var(--sg-muted); padding: var(--sg-space-m) var(--sg-space-l) var(--sg-space-xs); }
.sg-main { flex: 1; min-width: 0; padding: var(--sg-space-xxl); max-width: 1240px; margin: 0 auto; }

/* ── Every switch on the page is the system's segmented control. With none, the browser's own buttons in a row: the page
   never draws a control of its own (only layout here). ─────────────────────────────────────────────────────────────── */
.sg-seg { display: flex; flex-wrap: wrap; width: 100%; gap: var(--sg-space-xxs); }
.sg-seg button { font: inherit; }
.sg-seg button[aria-pressed="true"] { font-weight: var(--sg-heading-weight); }

/* ── Modes ───────────────────────────────────────────────────────────────── */
.sg-modes { display: flex; flex-direction: column; gap: var(--sg-space-l); }
.sg-mode-ctl { display: flex; flex-direction: column; align-items: stretch; gap: var(--sg-space-xs); }
.sg-mode-label { font-size: var(--sg-s); font-weight: var(--sg-s-weight); color: var(--sg-muted); }
.pg-footer { display: flex; flex-direction: column; gap: var(--sg-space-m); margin-top: var(--sg-space-xl); }
.pg-updated { display: grid; gap: var(--sg-space-l); margin: 0; font-size: var(--sg-s); color: var(--sg-muted); }   /* each section of the documentation clearly apart */
.pg-updated > div { display: grid; grid-template-columns: 140px 1fr; gap: var(--sg-space-s); }
.pg-updated dt { font-weight: var(--sg-heading-weight); color: var(--sg-text-2); }
.pg-updated dd { margin: 0; }
.pg-updated dd > p { margin: 0 0 var(--sg-space-xxs); }
.pg-doc > h3 { margin: 0 0 var(--sg-space-xs); }
.sg-mode-diff { font-size: var(--sg-s); color: var(--sg-text-2); line-height: var(--sg-lh); margin: 0; }
#mode-controls { margin-top: var(--sg-space-m); }

/* ── Section headings ────────────────────────────────────────────────────── */
.sg-section { margin-bottom: var(--sg-space-xxl); scroll-margin-top: var(--sg-space-l); }
.sg-section-badge { display: inline-flex; align-items: center; padding: var(--sg-space-xxs) var(--sg-space-s); border-radius: var(--sg-radius-pill); font-size: var(--sg-s); font-weight: var(--sg-s-weight); background: color-mix(in srgb, var(--sg-muted) 12%, transparent); color: var(--sg-muted); margin-bottom: var(--sg-space-s); }
.sg-section > h2, .pg-head > h2 { font-size: var(--sg-h2); font-weight: var(--sg-heading-weight); color: var(--sg-text); line-height: var(--sg-lh); margin-bottom: var(--sg-space-xs); }
.sg-section > p { font-size: var(--sg-m); color: var(--sg-text-2); line-height: var(--sg-lh); margin-bottom: var(--sg-space-xl); max-width: 560px; }
.sg-subsection { margin-bottom: var(--sg-space-xxl); }
.sg-subsection > h3 { font-size: var(--sg-s); font-weight: var(--sg-heading-weight); color: var(--sg-muted); margin-bottom: var(--sg-space-s); }   /* a title with no line under it */
.sg-hr { border: none; border-top: var(--sg-line); margin: var(--sg-space-xxl) 0; }

/* ── Overview ────────────────────────────────────────────────────────────── */
.sg-hero { margin-bottom: var(--sg-space-xxl); }
.sg-hero > h1 { font-size: var(--sg-h1); font-weight: var(--sg-heading-weight); color: var(--sg-text); line-height: var(--sg-lh); margin-bottom: var(--sg-space-s); }
.sg-hero > p { font-size: var(--sg-m); color: var(--sg-text-2); line-height: var(--sg-lh); max-width: 500px; }
.sg-pending { font-size: var(--sg-m); color: var(--sg-text); background: color-mix(in srgb, var(--sg-warning) 14%, transparent); border: 1px solid color-mix(in srgb, var(--sg-warning) 40%, transparent); border-radius: var(--sg-radius); padding: var(--sg-space-s) var(--sg-space-m); margin: 0 0 var(--sg-space-xl); max-width: 720px; }
.sg-usage-count { font-size: var(--sg-m); color: var(--sg-text-2); margin: 0 0 var(--sg-space-l); max-width: 720px; }
.sg-gap ul { margin: var(--sg-space-xs) 0 0; padding-left: var(--sg-space-l); }
/* Four to a row, with room around each; fewer on a narrower window. */
.sg-card-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sg-space-xl); margin-bottom: var(--sg-space-xxl); }
@media (max-width: 1100px) { .sg-card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) { .sg-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sg-space-l); } }
@media (max-width: 480px) { .sg-card-grid { grid-template-columns: 1fr; } }
/* Each overview link is the system's own card (DATA.ui.card); with none, a plain block link. Never a box of the page's. */
.sg-card { display: flex; flex-direction: column; gap: var(--sg-space-m); text-decoration: none; color: inherit; min-width: 0; }
.sg-card[hidden], .sg-section[hidden], .sg-hr[hidden], .sg-nav a[hidden] { display: none; }
.sg-hero > h1[tabindex="-1"]:focus, .pg-head > h2[tabindex="-1"]:focus, .sg-section > h2[tabindex="-1"]:focus { outline: none; }   /* the heading a new view moves focus to, for a screen reader */
.sg-overview-group { margin-bottom: var(--sg-space-xl); }
.sg-group-desc { font-size: var(--sg-m); color: var(--sg-text-2); margin: 0 0 var(--sg-space-l); max-width: 720px; }
.sg-status { display: inline-flex; align-items: center; padding: var(--sg-space-xxs) var(--sg-space-s); border-radius: var(--sg-radius-pill); font-size: var(--sg-xs); font-weight: var(--sg-s-weight); color: var(--sg-text); background: color-mix(in srgb, var(--sg-muted) 14%, transparent); vertical-align: middle; }
.sg-status--beta { background: color-mix(in srgb, var(--sg-accent) 16%, transparent); }
.sg-status--deprecated { background: color-mix(in srgb, var(--sg-warning) 24%, transparent); }
.pg-status { display: flex; align-items: center; gap: var(--sg-space-s); flex-wrap: wrap; margin: var(--sg-space-xs) 0 0; font-size: var(--sg-s); color: var(--sg-text-2); }
.sg-overview-group > h3 { font-size: var(--sg-l); font-weight: var(--sg-heading-weight); color: var(--sg-text); margin: 0 0 var(--sg-space-xs); }
/* Each card's thumbnail: a few of the real tokens, or the component itself, drawn small on the system's own surface. */
.sg-thumb { position: relative; height: 180px; overflow: hidden; contain: layout paint; display: flex; align-items: center; justify-content: center; gap: var(--sg-space-s); background: var(--sg-stage, var(--sg-bg)); border-radius: var(--sg-radius); pointer-events: none; }
.sg-thumb-dot { width: 32px; height: 32px; border: var(--sg-line); flex-shrink: 0; }   /* square, as each colour is on its page */
.sg-thumb-bar { height: var(--sg-space-s); background: var(--sg-text-2); border-radius: var(--sg-radius-s); }
.sg-thumb-col { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sg-space-xs); }
.sg-thumb-box { width: 36px; height: 36px; border: var(--sg-line); background: var(--sg-bg-2); flex-shrink: 0; }
.sg-thumb-live { transform-origin: center; flex-shrink: 0; align-self: center; margin: 0; }   /* centred in its card, whatever its own rule says of where it sits in a row */
#sg-search { margin-top: var(--sg-space-m); }
#sg-search > input { font: inherit; width: 100%; }
.sg-search-none { font-size: var(--sg-s); color: var(--sg-muted); padding: var(--sg-space-xs) var(--sg-space-l); }
.sg-results { margin: var(--sg-space-s) calc(-1 * var(--sg-space-l)) 0; padding-bottom: 0; }   /* just below the field, the width of the sidebar */
.sg-result { display: flex; flex-direction: column; min-width: 0; }
.sg-result > span:first-child { overflow-wrap: anywhere; }
.sg-result-kind { font-size: var(--sg-xs); color: var(--sg-muted); }
.sg-found { outline: var(--sg-line); outline-color: var(--sg-accent); outline-offset: var(--sg-space-xxs); }
.sg-card > h3 { font-size: var(--sg-l); font-weight: var(--sg-heading-weight); color: var(--sg-text); margin-bottom: var(--sg-space-xs); }
.sg-screens { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sg-space-l); }
.sg-screen { border: var(--sg-line); border-radius: var(--sg-radius); overflow: hidden; background: var(--sg-surface); box-shadow: var(--sg-shadow); }
.sg-screen img { display: block; width: 100%; height: auto; }
.sg-screen figcaption { padding: var(--sg-space-s) var(--sg-space-m); font-size: var(--sg-s); font-weight: var(--sg-s-weight); color: var(--sg-muted); border-top: var(--sg-line); }

/* ── Foundations ─────────────────────────────────────────────────────────── */
.sg-demo { background: var(--sg-surface); border: var(--sg-line); border-radius: var(--sg-radius); padding: var(--sg-space-xl) var(--sg-space-l); display: flex; flex-wrap: wrap; gap: var(--sg-space-m); align-items: flex-start; }
.sg-demo.sg-demo--col { flex-direction: column; align-items: stretch; gap: var(--sg-space-s); }
.color-chip { display: flex; flex-direction: column; gap: var(--sg-space-xs); width: 96px; }
.color-chip-swatch { height: 72px; border: var(--sg-line); }   /* square corners, as on the overview; the colour twice the height of its label */
.color-chip-label { font-size: var(--sg-xs); font-weight: var(--sg-heading-weight); color: var(--sg-muted); line-height: var(--sg-lh); word-break: break-word; }
.color-chip-value { font-size: var(--sg-xs); color: var(--sg-muted); word-break: break-all; }
.sg-uses-link { color: inherit; }   /* a token's name, linked to what uses it: underlined, in the colour around it */
.type-list { display: grid; grid-template-columns: 1fr; gap: var(--sg-space-m); }
.type-specimen-preview { color: var(--sg-text); padding: var(--sg-space-m); border-bottom: var(--sg-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* the sample on one row, under the style's name */
.type-specimen.pg-inspect td:last-child { word-break: normal; overflow-wrap: break-word; }   /* a name and its value wrap between words, never inside one */
.spacing-row { display: flex; align-items: center; gap: var(--sg-space-m); padding: var(--sg-space-xs) 0; border-bottom: var(--sg-line); }
.spacing-row:last-child { border-bottom: none; }
.spacing-bar-wrap { width: 120px; }
.spacing-bar { height: 8px; background: var(--sg-accent); border-radius: var(--sg-radius-s); min-width: 1px; }
.spacing-meta { font-size: var(--sg-xs); font-weight: var(--sg-heading-weight); color: var(--sg-muted); flex: 1; }
.spacing-name { color: var(--sg-text-2); font-size: var(--sg-xs); }
.radius-chip { display: flex; flex-direction: column; align-items: center; gap: var(--sg-space-s); width: 96px; }
.radius-chip-box { width: 48px; height: 48px; background: var(--sg-bg-2); border: var(--sg-line); }
.radius-chip-label { font-size: var(--sg-xs); font-weight: var(--sg-heading-weight); color: var(--sg-muted); text-align: center; line-height: var(--sg-lh); word-break: break-all; }
.icon-chip { display: flex; flex-direction: column; align-items: center; gap: var(--sg-space-xs); padding: var(--sg-space-l) var(--sg-space-m); min-width: 100px; }
.icon-chip svg { width: var(--sg-icon); height: var(--sg-icon); color: var(--sg-text); }
.token-pill { display: inline-block; font-size: var(--sg-xs); font-weight: var(--sg-heading-weight); padding: 1px var(--sg-space-xs); border-radius: var(--sg-radius-s); background: var(--sg-bg-2); color: var(--sg-muted); border: var(--sg-line); }

/* ── Component playground ────────────────────────────────────────────────── */
.pg-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sg-space-m); flex-wrap: wrap; }
.pg-head > h2 { margin: 0; }
.pg-usage { display: flex; flex-wrap: wrap; gap: var(--sg-space-xs); align-items: center; }
.pg-usage-label { font-size: var(--sg-s); font-weight: var(--sg-s-weight); color: var(--sg-muted); }
.pg-usage-name { font-size: var(--sg-s); color: var(--sg-text-2); }
a.pg-usage-name { color: var(--sg-text); }
.pg-selector { font-size: var(--sg-s); color: var(--sg-muted); margin: var(--sg-space-xs) 0 var(--sg-space-m); }
/* A component's page in areas (playground, documentation, accessibility, parity), switched by the system's own
   segmented control; how a product imports it and what it is built with, above them. */
/* The areas stay at the top while the component's page scrolls, under the top bar when one shows. */
.pg-areas { margin: var(--sg-space-m) 0 var(--sg-space-l); position: sticky; top: var(--sg-sticky-top, 0px); z-index: 15; background: var(--sg-bg); padding: var(--sg-space-s) 0; display: flex; align-items: center; gap: var(--sg-space-m); flex-wrap: wrap; }
/* Its name stays in view: in the sticky bar beside the areas once its heading has scrolled away. */
.pg-areas-name { display: none; font-size: var(--sg-h2); font-weight: var(--sg-heading-weight); color: var(--sg-text); }
.pg-areas.is-stuck > .pg-areas-name { display: inline; }
/* A foundation's title stays at the top as its page scrolls. */
.sg-section:not(.pg-card-section) > h2 { position: sticky; top: var(--sg-sticky-top, 0px); z-index: 15; background: var(--sg-bg); margin: 0; padding: var(--sg-space-s) 0; }
.pg-import { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sg-space-s); margin: var(--sg-space-xs) 0; font-size: var(--sg-s); color: var(--sg-text-2); }
.pg-import code { font-family: inherit; color: var(--sg-text); }
.pg-parity-sum { font-size: var(--sg-m); color: var(--sg-text-2); margin: 0 0 var(--sg-space-m); }
.pg-parity td:last-child { word-break: normal; overflow-wrap: anywhere; }
/* Where it is used: each product's own page pictured, the component marked on it. */
.pg-usedin { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.pg-shot { position: relative; overflow: hidden; border-radius: var(--sg-radius); border: var(--sg-line); background: var(--sg-bg-2); }
.pg-shot img { display: block; width: 100%; height: auto; }
.pg-mark { position: absolute; border: 2px solid var(--sg-accent); border-radius: var(--sg-radius-s); pointer-events: none; }
/* The code a product writes for what the playground shows, with the system's button to copy it. */
.pg-code-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sg-space-m); align-items: start; }
.pg-code { border: var(--sg-line); border-radius: var(--sg-radius); overflow: hidden; min-width: 0; display: flex; flex-direction: column; box-shadow: var(--sg-shadow); }
.pg-code-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sg-space-s); padding: var(--sg-space-xs) var(--sg-space-m); border-bottom: var(--sg-line); background: var(--sg-bg-2); }
.pg-code-title { font-size: var(--sg-s); font-weight: var(--sg-s-weight); color: var(--sg-muted); }
.pg-code pre { flex: 1; min-height: 0; margin: 0; padding: var(--sg-space-m); overflow: auto; font-size: var(--sg-s); line-height: var(--sg-lh); color: var(--sg-text); background: var(--sg-bg); }
.pg-code pre, .pg-code code { font-family: inherit; white-space: pre; }
/* Words for a screen reader only (a mark's meaning, a copy confirmed). */
.sg-hidden-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pg-req { color: var(--sg-text); font-weight: var(--sg-heading-weight); }
.pg-legend { font-size: var(--sg-s); color: var(--sg-muted); padding: var(--sg-space-xs) var(--sg-space-m); border-top: var(--sg-line); }
.pg-wcag { display: block; font-size: var(--sg-s); color: var(--sg-muted); }
.pg-note { display: flex; gap: var(--sg-space-s); font-size: var(--sg-m); line-height: var(--sg-lh); color: var(--sg-text-2); background: var(--sg-bg-2); border: var(--sg-line); border-radius: var(--sg-radius); padding: var(--sg-space-s) var(--sg-space-m); margin: 0 0 var(--sg-space-s); }
.pg-note b { color: var(--sg-text); font-weight: var(--sg-heading-weight); white-space: nowrap; }
.pg-diff-list { margin: 0; padding-left: var(--sg-space-l); display: flex; flex-direction: column; gap: var(--sg-space-xs); }
.pg-diff-list b { white-space: normal; }
.pg-todo { display: block; margin-top: var(--sg-space-xxs); color: var(--sg-text-2); }
.sg-todo-group { margin-bottom: var(--sg-space-xl); }
.sg-todo-group > h3 { font-size: var(--sg-l); font-weight: var(--sg-heading-weight); color: var(--sg-text); margin: 0 0 var(--sg-space-xs); }
.sg-todo-group > p { font-size: var(--sg-m); color: var(--sg-text-2); margin: 0 0 var(--sg-space-m); }
.sg-todo-list { margin: 0; padding-left: var(--sg-space-xl); display: flex; flex-direction: column; gap: var(--sg-space-m); font-size: var(--sg-m); color: var(--sg-text); line-height: var(--sg-lh); }
.sg-todo-list .pg-todo { font-weight: var(--sg-heading-weight); color: var(--sg-text); }
.pg-diff { border-color: color-mix(in srgb, var(--sg-warning) 40%, transparent); }
.pg-note:last-child { margin-bottom: var(--sg-space-m); }
.pg-header { background: var(--sg-bg); padding: var(--sg-space-s) 0 var(--sg-space-m); margin-bottom: var(--sg-space-xs); }   /* scrolls away; the areas below it stay */
.pg-stage { display: flex; flex-direction: column; gap: var(--sg-space-l); }
.pg-preview-card { display: grid; grid-template-columns: 1fr minmax(240px, 340px); gap: var(--sg-space-l); align-items: stretch; border: var(--sg-line); border-radius: var(--sg-radius-l); padding: var(--sg-space-l); background: var(--sg-bg); box-shadow: var(--sg-shadow); }
.pg-preview { min-width: 0; min-height: 140px; padding: var(--sg-space-xl); display: flex; align-items: safe center; align-content: safe center; justify-content: safe center; gap: var(--sg-space-m); flex-wrap: wrap; position: relative; isolation: isolate; }

<script>
(function () {

      if (auto) items.unshift({ v: '__auto', label: 'Auto', title: 'Follows this device\'s setting' });
      wrap.innerHTML = '<span class="sg-mode-label">' + esc(axis.label) + '</span>' + segHTML(items);

    navLink('c-' + c.name, c.name);
    if (ALL) BUILDERS['c-' + c.name](); else { try { thumbOf(c, baseElement(c)); } catch (e) {} }
  });
  if (!COMPONENTS.length && !FLAT.length) { var empty = document.createElement('p'); empty.className = 'pg-empty'; empty.textContent = 'Nothing agreed yet.'; main.appendChild(empty); }

  // The menu, on every screen: its buttons say what they do in words (the system's own text button), never an icon
  // alone. On a phone, Menu at the top opens the sidebar as a panel over the page (the system's overlay), closed by
  // Close menu, the overlay, a link or Escape. On a wide screen, Hide menu gives the page the full width and Menu
  // at the top brings it back; the choice is remembered in this browser.
  (function () {
    var bar = document.getElementById('sg-topbar'), side = document.getElementById('sg-sidebar'), scrim = document.getElementById('sg-scrim');
    document.getElementById('sg-topbar-title').textContent = DATA.title || 'Design system';
    bar.insertAdjacentHTML('afterbegin', sysButton('button', 'Menu', ' id="sg-menu"'));
    side.querySelector('.sg-sidebar-header').insertAdjacentHTML('afterbegin', sysButton('button', 'Close menu', ' id="sg-nav-close"'));
    side.querySelector('.sg-sidebar-header').insertAdjacentHTML('afterbegin', '<p class="sg-hide-nav">' + sysButton('button', 'Hide', ' id="sg-hide-nav" aria-label="Hide menu" title="Hide menu"') + '</p>');
    var menu = document.getElementById('sg-menu'), shut = document.getElementById('sg-nav-close'), hide = document.getElementById('sg-hide-nav');
    shut.classList.add('sg-nav-close');
    if (DATA.ui && DATA.ui.overlay) scrim.classList.add(DATA.ui.overlay);
    menu.setAttribute('aria-controls', 'sg-sidebar'); menu.setAttribute('aria-expanded', 'false');
    var phone = function () { return window.matchMedia && window.matchMedia('(max-width: 720px)').matches; };
    var remember = function (on) { try { localStorage.setItem('sg-nav-hidden', on ? '1' : ''); } catch (e) {} };
    // What sticks to the top of a page (a component's areas) sits under the top bar when one shows.
    var stickTop = function () { var h = getComputedStyle(bar).display === 'none' ? 0 : bar.offsetHeight; document.documentElement.style.setProperty('--sg-sticky-top', h + 'px'); };
    window.addEventListener('resize', stickTop); stickTop();
    var setHidden = function (on) { document.body.classList.toggle('sg-nav-hidden', on); menu.setAttribute('aria-expanded', on ? 'false' : 'true'); remember(on); stickTop(); };
    try { if (!ALL && localStorage.getItem('sg-nav-hidden') === '1') setHidden(true); } catch (e) {}
    hide.addEventListener('click', function () { setHidden(true); menu.focus(); });
    var open = function (on) {
      document.body.classList.toggle('sg-nav-open', on); menu.setAttribute('aria-expanded', on ? 'true' : 'false');
      if (on) setTimeout(function () { shut.focus({ preventScroll: true }); }, 50); else menu.focus();   // never the search: no keyboard pops up
    };
    menu.addEventListener('click', function () { if (phone()) open(true); else { setHidden(false); hide.focus(); } });
    shut.addEventListener('click', function () { open(false); });
    scrim.addEventListener('click', function () { open(false); });
    side.addEventListener('click', function (e) { if (e.target.closest('.sg-nav a') && document.body.classList.contains('sg-nav-open')) { document.body.classList.remove('sg-nav-open'); menu.setAttribute('aria-expanded', 'false'); } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('sg-nav-open')) open(false); });
  })();

  // Search: the system's own text field in the sidebar, over everything the page holds (components with their
  // descriptions, annotations and props, every token by its Figma name and variable, type styles, icons, to-dos and
  // sections). While it has words, only the results show, just below it, in place of the navigation. Escape clears it.
  var sMount = document.getElementById('sg-search');
  if (sMount) {
    sMount.innerHTML = DATA.ui && DATA.ui.field ? DATA.ui.field.markup : '<input type="text">';
    var q = sMount.querySelector('input'); q.type = 'search'; q.placeholder = 'Search'; q.setAttribute('aria-label', 'Search the style guide'); q.removeAttribute('value');
    var results = document.createElement('div'); results.className = 'sg-nav sg-results'; results.id = 'sg-results'; results.hidden = true; results.setAttribute('role', 'region'); results.setAttribute('aria-label', 'Search results');
    sMount.parentNode.insertBefore(results, sMount.nextSibling);
    q.setAttribute('aria-controls', 'sg-results');
    var INDEX = null;
    var index = function () {
      if (INDEX) return INDEX;
      INDEX = [];
      var add = function (kind, label, href, find, more) { INDEX.push({ kind: kind, label: label, href: href, find: find || null, hay: [kind, label].concat(more || []).join(' ').toLowerCase() }); };
      Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) { var h = a.getAttribute('href'); if (!/^#c-/.test(h)) add('Section', a.textContent.trim(), h); });
      COMPONENTS.forEach(function (c) {
        add('Component', c.name, '#c-' + c.name, null, [c.description, c.role, c.cls, c.note].concat(c.annotations || [], (c.controls || []).map(function (k) { return k.label + ' ' + (k.options || []).map(function (o) { return o.label; }).join(' '); }), (c.unbuilt || []).map(function (u) { return u.label; }), (c.slots || []).map(function (x) { return x.name; })));
        ((c.ownTokens && c.ownTokens.colors) || []).concat((c.ownTokens && c.ownTokens.sizes) || []).forEach(function (t) { add('Token in ' + c.name, t.figma, '#c-' + c.name, t.figma, [t.var, t.value]); });
        (c.controls || []).forEach(function (k) { add('Prop of ' + c.name, k.label, '#c-' + c.name, null, [k.prop].concat((k.options || []).map(function (o) { return o.label; }))); });
      });
      FLAT.forEach(function (t) { add('Colour', t.figma, '#colors', t.figma, [t.var]); });
      [['spacing', 'Spacing'], ['radii', 'Radius']].forEach(function (k) { (TOKENS[k[0]] || []).forEach(function (t) { add(k[1], t.figma, '#' + k[0], t.figma, [t.var, t.value]); }); });
      (TOKENS.typography || []).forEach(function (t) { add('Type style', t.scale, '#typography', null, ['size', 'weight', 'lh', 'family'].map(function (k) { return t[k] ? [t[k].figma, t[k].var, t[k].value].join(' ') : ''; })); });
      (TOKENS.iconStrokes || []).forEach(function (t) { add('Icon stroke', t.figma, '#icons', t.figma, [t.var, t.value]); });
      var FIGI = DATA.iconFigma || {};
      (DATA.icons || []).forEach(function (id) { var n = (FIGI[id] && FIGI[id].name) || id, px = FIGI[id] && FIGI[id].size; add('Icon' + (px ? ' ' + px + 'px' : ''), n, '#icons', n, [id]); });
      TODO.forEach(function (t) { add('To do ' + t.no, t.say, '#todo', null, [t.todo, t.comp]); });
      return INDEX;
    };
    var pending = null;
    // A token, icon or style found: its own place on the page is brought into view and marked for a moment.
    var reveal = function () {
      if (!pending) return; var f = pending; pending = null;
      var sec = document.getElementById(f.href.slice(1)); if (!sec || !f.find) return;
      var el = Array.prototype.find.call(sec.querySelectorAll('*'), function (k) { return !k.children.length && k.textContent.trim() === f.find; });
      if (!el) return;
      var box = el.closest('.color-chip, .icon-chip, .spacing-row, .radius-chip, tr') || el;
      box.scrollIntoView({ block: 'center' }); box.classList.add('sg-found'); setTimeout(function () { box.classList.remove('sg-found'); }, 1600);
    };
    window.addEventListener('hashchange', function () { setTimeout(reveal, 0); });
    var go = function (r) {
      pending = r;
      if (location.hash === r.href) setTimeout(reveal, 0); else location.hash = r.href;
      if (document.body.classList.contains('sg-nav-open')) { document.body.classList.remove('sg-nav-open'); document.getElementById('sg-menu').setAttribute('aria-expanded', 'false'); }
    };
    var found = [];
    var search = function () {
      var words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      nav.hidden = !!words.length; results.hidden = !words.length;
      if (!words.length) { results.innerHTML = ''; found = []; return; }
      found = index().filter(function (r) { return words.every(function (w) { return r.hay.indexOf(w) >= 0; }); })
        .sort(function (a, b) { var p = function (r) { var l = r.label.toLowerCase(); return l === words.join(' ') ? 0 : l.indexOf(words[0]) === 0 ? 1 : l.indexOf(words[0]) >= 0 ? 2 : 3; }; return p(a) - p(b); }).slice(0, 60);
      results.innerHTML = found.length ? found.map(function (r, n) { return '<a href="' + esc(r.href) + '" data-n="' + n + '"><span class="dot"></span><span class="sg-result"><span>' + esc(r.label) + '</span><span class="sg-result-kind">' + esc(r.kind) + '</span></span></a>'; }).join('')
        : '<p class="sg-search-none" role="status">Nothing matches ' + esc(q.value.trim()) + '.</p>';
    };
    results.addEventListener('click', function (e) { var a = e.target.closest('a[data-n]'); if (!a) return; e.preventDefault(); go(found[+a.dataset.n]); });
    q.addEventListener('input', search);
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { q.value = ''; search(); }
      if (e.key === 'Enter' && found.length) { e.preventDefault(); go(found[0]); }
    });
  }

  // Global mode controls: every axis on <html>; a change re-reads every card and re-syncs the per-card controls.
  var mount = document.getElementById('mode-controls');
  // A change on the page applies to every component: each one's own choice of that mode is dropped, so it follows.
  if (mount && AXES.length) { var pageModes = SGModes.controls(html, function (axis) {
    if (axis && axis.attr) document.querySelectorAll('.pg-preview[' + axis.attr + '], .sg-scope[' + axis.attr + ']').forEach(function (p) { p.removeAttribute(axis.attr); });
    refreshers.concat(DRAWERS).forEach(function (r) { try { r(); } catch (e) {} }); SGModes.syncAll();
  }, function (a) { return a.attr !== 'data-size'; }); mount.appendChild(pageModes); SGModes.register(pageModes); }   // a size (breakpoint) is switched on each component and section, not for the page
  // The browser's own setting leads until someone picks a mode: when it changes (the computer goes dark at night, the
  // window narrows), the page and every component not switched by hand follow it.
  AXES.forEach(function (axis) {
    var mq = axis.media && window.matchMedia ? window.matchMedia(axis.media) : null;
    // The measuring page (?all) keeps every drawn component as it is when the colour scheme changes: the engine
    // switches the scheme while it reads them, and a redraw would replace the very elements it is reading.
    if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (!ALL) refreshers.concat(DRAWERS).forEach(function (r) { try { r(); } catch (e) {} }); SGModes.syncAll(); });
  });

  // What uses a token (#uses?t=--name): the components that use it in their own rules, then those that use it through
  // another token, each linked to its page. Built the first time it is opened, written again for each token.
  BUILDERS.uses = function () {
    var s = section('uses', 'Token', 'Token', null);
    var named = function (v) {
      var hit = null;
      (TOKENS.colors || []).forEach(function (g) { g.items.forEach(function (t) { if (t.var === v) hit = t.figma; }); });
      ['spacing', 'radii', 'sizing', 'iconStrokes'].forEach(function (k) { (TOKENS[k] || []).forEach(function (t) { if (t.var === v) hit = t.figma; }); });
      (TOKENS.typography || []).forEach(function (t) { ['size', 'weight', 'lh', 'ls', 'family'].forEach(function (k) { if (t[k] && t[k].var === v) hit = t[k].figma; }); });
      return hit;
    };
    var body = document.createElement('div'); body.className = 'sg-uses pg-doc'; s.appendChild(body);
    s._link = function (q) {
      var v = (q && q.get('t')) || '', u = USES[v] || { direct: [], via: [] }, fig = named(v), val = v ? getComputedStyle(html).getPropertyValue(v).trim() : '';
      var link = function (n) { return '<a class="sg-uses-link" href="#c-' + esc(n) + '">' + esc(n) + '</a>'; };
      var by = function (a, b) { return (a.name || a).localeCompare(b.name || b); }, n = u.direct.length + u.via.length;
      s.querySelector('h2').textContent = v || 'Token';
      body.innerHTML = '<p>' + esc(!n ? 'No component uses it.' : (n === 1 ? 'One component uses it' : n + ' components use it') + (u.via.length ? ', ' + (u.direct.length ? u.direct.length + ' in their own rules and ' : '') + u.via.length + ' through another token.' : '.')) + '</p><dl class="pg-updated">' +
        (fig ? '<div><dt>In Figma</dt><dd><p>' + esc(fig) + '</p></dd></div>' : '') +
        (val ? '<div><dt>Its value now</dt><dd><p>' + esc(val) + '</p></dd></div>' : '') +
        '<div><dt>Used by</dt><dd>' + (u.direct.length ? u.direct.slice().sort(by).map(function (x) { return '<p>' + link(x) + '</p>'; }).join('') : '<p>No component uses it in its own rules.</p>') + '</dd></div>' +
        (u.via.length ? '<div><dt>Through another token</dt><dd>' + u.via.slice().sort(by).map(function (x) { return '<p>' + link(x.name) + ', through ' + usesLink(x.through) + '</p>'; }).join('') + '</dd></div>' : '') +
        '</dl>';
    };
    s._link(hashParts().q);
    return s;
  };

  // One view at a time: the overview, a foundation or a component, by the address (#c-badge), so each can be shared.
  // With ?all every view shows, one after another, as before.
  var links = document.querySelectorAll('.sg-nav a');
  function route() {
    var at = hashParts(), id = at.id || 'overview', built = !!document.getElementById(id);
    if (!built && BUILDERS[id]) BUILDERS[id]();
    if (built && document.getElementById(id)._link) document.getElementById(id)._link(at.q);
    var target = document.getElementById(id) && document.getElementById(id).matches('main > section') ? document.getElementById(id) : document.getElementById('overview');
    if (!ALL) Array.prototype.forEach.call(main.children, function (k) { if (k.matches('section, .sg-hr')) k.hidden = k !== target; });
    links.forEach(function (a) { var on = a.getAttribute('href').slice(1) === target.id; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (target.id === 'overview') Object.keys(THUMBS).forEach(function (k) { fitThumb(THUMBS[k]); });
    if (!ALL) {
      window.scrollTo(0, 0);
      var h = target.querySelector('h1, h2'); document.title = (h && target.id !== 'overview' ? h.textContent + ' · ' : '') + (DATA.title || 'Design system') + ' · Living style guide';
      if (h && route.ran) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }
    route.ran = true; nudge();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
