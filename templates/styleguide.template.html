     frame; its styles and its script are parts of their own under templates/styleguide/ (css/ and js/, one area of the
     page each), joined where each @part line stands (styleguide-template.mjs). Edit a part, or the frame, and
     every project gets the change on its next run. styleguide-gen.mjs fills the markers with each project's own data
     (its tokens, components, icons, docs and apps); nothing project-specific is written in this file. The page shows
     only what Figma and the code agree on: tokens the token check found equal, components drawn with the project's own
     CSS and markup, controls for the props both sides have, labelled with Figma's names. A project can still point
     ds-config.json → styleguide.template at a template of its own. -->

<script>
// A host that caches the page (GitHub Pages keeps a copy for ten minutes) can serve one older than the last published:
// the page asks the host when its newest copy was published and opens that one when it is newer, so a new build shows
// as soon as it is out. Nothing happens on a file opened from disk or when the host does not say.
(function () {
  if (!/^https?:$/.test(location.protocol) || !window.fetch) return;
  var mine = Date.parse(document.lastModified);
  fetch(location.pathname + '?fresh=' + Date.now(), { method: 'HEAD', cache: 'no-store' }).then(function (r) {
    var theirs = Date.parse((r && r.headers.get('last-modified')) || '');
    if (!theirs || !mine || theirs <= mine + 1000) return;
    var u = new URL(location.href);
    if (u.searchParams.get('v') === String(theirs)) return;   // already asked for that copy
    u.searchParams.set('v', String(theirs));
    location.replace(u.href);
  }).catch(function () {});
})();
</script>
