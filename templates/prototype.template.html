<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>

/*{{THEME_CSS}}*/
/*{{COMPONENT_CSS}}*/

<style>
/* The bar above the prototype is the engine's, not the design system's: it keeps to its own prefixed classes. */
html, body { margin: 0; }
.pt-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; font: 13px/1.4 system-ui, sans-serif; color: #1d1d1f; background: #f5f5f7; border-bottom: 1px solid #d2d2d7; }
.pt-bar .pt-name { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
.pt-bar button { font: inherit; padding: 4px 10px; border: 1px solid #c7c7cc; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
.pt-bar button[aria-pressed="true"] { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
.pt-seg { display: inline-flex; gap: 4px; }
.pt-note { color: #6e6e73; }
.pt-gaps { font: 13px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #fffbe6; border-bottom: 1px solid #e8d97a; padding: 10px 16px; }
.pt-gaps h2 { font-size: 13px; margin: 0 0 4px; }
.pt-gaps ul { margin: 0; padding-left: 18px; }
.pt-gaps[hidden] { display: none; }
/* The engine's neutral pieces: arrangement only. Outlined only when asked, so the prototype looks as it will. */
.pt-engine { box-sizing: border-box; }
.pt-show .pt-engine { outline: 1px dashed #8e8e93; outline-offset: -1px; }
.pt-show [data-pt-standin] { outline: 2px solid #ff9f0a; outline-offset: 2px; }
.pt-missing-box { display: flex !important; flex-direction: column; align-items: stretch !important; justify-content: flex-start !important; gap: 4px; }
.pt-missing-cap { font: 11px/1.4 system-ui, sans-serif; color: #6e6e73; }
/* A component Figma has and the code has not built: what the screen put inside it, outlined only when asked. */
.pt-unbuilt { box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; min-width: 0; min-height: 0; }
.pt-unbuilt > .pt-missing-cap { display: none; }
.pt-show .pt-unbuilt { outline: 2px dashed #ff9f0a; outline-offset: -2px; }
.pt-show .pt-unbuilt > .pt-missing-cap { display: block; }
.pt-popover { position: absolute; z-index: 20; }
.pt-missing { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border: 1px dashed #8e8e93; border-radius: 4px; font: 12px/1.4 system-ui, sans-serif; color: #6e6e73; background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(142,142,147,.08) 6px 12px); }
</style>
</head>
<body>

  <button type="button" id="pt-outline" aria-pressed="false">Show engine layout and stand-ins</button>
  <button type="button" id="pt-gaps-toggle" aria-pressed="false">Gaps</button>
  <span class="pt-note" id="pt-note"></span>
</div>
<section class="pt-gaps" id="pt-gaps" hidden><h2>What the design system would need</h2><ul></ul></section>
<main id="pt-canvas"></main>
<script type="application/json" id="pt-data">/*{{PROTOTYPE}}*/</script>

    });

  }
  // ── It works as in a product ──────────────────────────────────────────────────────────────────────────────────────
  // A part that says "opens": "<id>" opens the part of that id: an overlay the system's CSS shows over the window (a
  // modal: its container, layers, open and closing classes, as the style guide plays it), else a popover under the part.
  // Closed by Escape, a click outside it, or a button or link inside it; the focus goes back to what opened it.

  function playTime(root) { var ms = 0; [root].concat(Array.prototype.slice.call(root.querySelectorAll('*'))).forEach(function (k) { var cs = getComputedStyle(k); cs.animationDuration.split(',').forEach(function (d, i) { var t = (parseFloat(d) || 0) * (/ms$/.test(d.trim()) ? 1 : 1000) + (parseFloat((cs.animationDelay.split(',')[i] || '0')) || 0) * 1000; ms = Math.max(ms, t); }); }); return ms; }

      wrap.className = mv.container + ' ' + mv.open;

      if (!el.getAttribute('role')) el.setAttribute('role', 'dialog');
    }

    function outside(e) { if (!wrap.contains(e.target) && !trigger.contains(e.target) && wrap === lastLayer()) close(); }
    function close() {
      if (closing) return; closing = true;
      document.removeEventListener('keydown', key, true); document.removeEventListener('mousedown', outside, true);

    });

    if (!mv) document.addEventListener('mousedown', outside, true);
    var first = Array.prototype.find.call(el.querySelectorAll('button, a[href], input, select, textarea, [tabindex]'), function (k) { return !k.disabled && k.getClientRects().length && getComputedStyle(k).visibility !== 'hidden'; });

    var box = ev.target.closest && ev.target.closest('#pt-canvas, .pt-open-layer'); if (!box) return;

    }

  // The system's own modes (colour and size), as in the style guide.
  (D.modes || []).forEach(function (axis) {
    var box = document.getElementById('pt-modes');
    axis.values.forEach(function (v, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = v.label; b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (axis.classes) { axis.values.forEach(function (x) { if (x.value) html.classList.remove(x.value); }); if (v.value) html.classList.add(v.value); }
        else if (!v.value) html.removeAttribute(axis.attr); else html.setAttribute(axis.attr, v.value);

  if (wanted.length) Array.prototype.forEach.call(document.querySelectorAll('#pt-modes button'), function (b) { if (wanted.indexOf(b.textContent.trim().toLowerCase()) >= 0) b.click(); });
